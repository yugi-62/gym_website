<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Gym Website - 결제</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/payment.css">
</head>
<body>
    <header class="container"><h1><a href="index.html">GYM LOGO</a></h1></header>
    <main class="container">
        <h2 class="page-title">수강권 결제</h2>
        <div class="payment-container">
            <div class="form-group">
                <label for="month-select">개월 수 선택 (1개월 = 10,000원)</label>
                <select id="month-select">
                    <option value="">선택하세요</option>
                    <!-- JS로 1~12개월 옵션 생성 -->
                </select>
                <p class="info-text">* 3개월마다 1,000원 추가 할인 적용</p>
            </div>

            <div class="form-group">
                <label>결제 방법</label>
                <div class="payment-methods">
                    <label><input type="radio" name="method" value="card"> 카드</label>
                    <label><input type="radio" name="method" value="cash"> 현금</label>
                </div>
            </div>

            <div class="form-group">
                <label for="coupon-code">쿠폰 입력</label>
                <div class="coupon-input-group">
                    <input type="text" id="coupon-code" placeholder="쿠폰 코드를 입력하세요">
                    <button id="btn-apply-coupon">적용</button>
                </div>
                <p id="coupon-message" class="message"></p>
            </div>

            <div class="price-summary">
                <div class="price-row"><span>상품 금액</span><span id="base-price">0원</span></div>
                <div class="price-row discount"><span>기간 할인</span><span id="period-discount">-0원</span></div>
                <div class="price-row discount"><span>쿠폰 할인</span><span id="coupon-discount">-0원</span></div>
                <div class="total-price">총 결제 금액: <span id="final-price">0원</span></div>
            </div>

            <button id="btn-pay" class="btn-submit">결제하기</button>
        </div>
    </main>
    <footer></footer>
    <script src="js/common.js"></script>
    <script src="js/payment.js"></script>
</body>
</html>
