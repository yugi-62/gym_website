<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Gym Website - 공지사항</title>
    <link rel="stylesheet" href="CSS/reset.css">
    <link rel="stylesheet" href="CSS/common.css">
    <link rel="stylesheet" href="CSS/notice.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="main.html"><img src="assets/images/sm_logo.jpg" alt="SM Gym Logo" style="height: 60px; width: auto;"></a></h1>
            <nav>
                <ul>
                    <li><a href="intro.html">소개</a></li>
                    <li><a href="notice.html">공지사항</a></li>
                    <li><a href="exercise.html">운동안내</a></li>
                    <li><a href="support.html">고객센터</a></li>
                    <li><a href="login.html">로그인</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container">
        <h2 class="page-title">공지사항</h2>
        <div class="notice-container">
            <div class="search-bar">
                <select>
                    <option value="title">제목</option>
                    <option value="content">내용</option>
                </select>
                <input type="text" placeholder="검색어를 입력하세요">
                <button>검색</button>
            </div>
            <table class="notice-board">
                <thead>
                    <tr>
                        <th class="col-no">번호</th>
                        <th class="col-title">제목</th>
                        <th class="col-date">작성일</th>
                        <th class="col-views">조회수</th>
                    </tr>
                </thead>
                <tbody id="notice-list">
                    <!-- 자바스크립트로 데이터가 로드됩니다 -->
                </tbody>
            </table>
            <div class="pagination">
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 Sangmyung Sports Center. All rights reserved.</p>
        </div>
    </footer>
    <script src="JS/common.js"></script>
    <script src="js/notice.js"></script>
</body>
</html>
